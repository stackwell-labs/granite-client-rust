[package]
name = "granite-client"
version = "0.19.0"
edition = "2021"
description = "Typed async client for the Granite approval core. One source of truth for the wire contract, header policy, and destructive-intent taxonomy."
license = "MIT OR Apache-2.0"
repository = "https://github.com/stackwell-labs/granite-client"
readme = "README.md"
keywords = ["approval", "granite", "agent", "consent"]
categories = ["api-bindings", "authentication"]

[dependencies]
# Only for the `Environment` re-export in lib.rs, which consumers still name
# as `granite_client::Environment`. Approvals and grants carry no environment
# (granite#102). A consumer that also names `capability::Environment` must pin
# the SAME capability tag as this crate, or the two are different types.
capability = { git = "https://github.com/stackwell-labs/capability.git", tag = "v0.5.0" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde"] }
# `ApprovalGrant::expires_at` and `CreateApprovalRequest::expires_at`, in the
# same RFC 3339 serde form Granite reads and writes.
time = { version = "0.3", features = ["serde-well-known"] }
# Only `time` (for await_decision's poll sleep). The runtime-agnostic
# primitive is poll_decision, which pulls in nothing.
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
warden-verify = { git = "https://github.com/stackwell-labs/warden-verify.git", tag = "v0.2.0" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
